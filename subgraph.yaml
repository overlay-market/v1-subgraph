      abi: OverlayV1Factory
      startBlock: 67907766
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - FeeRecipientUpdated
        - FeedFactoryAdded
        - MarketDeployed
        - ParamUpdated
      abis:
        - name: OverlayV1Factory
          file: ./abis/OverlayV1Factory.json
        - name: ERC20
